version: '3.8'
services:
  frontend:  # simplified service name
    build: ./frontend
    container_name: anycademy-frontend  # explicit container name
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    # ...other configurations...

  backend:
    build:
      context: ./backend/microservices/nodejs  # Updated path
      dockerfile: Dockerfile
    container_name: anycademy-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
    depends_on:
      - anycademy-database

  anycademy-database:
    build:
      context: ./database
      dockerfile: Dockerfile
    env_file: 
      - .env
    environment:
      POSTGRES_DB: anycademy
    ports:
      - "12900:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ...other configurations...

  file_server:
    image: minio/minio
    container_name: anycademy-file-server
    ports:
      - "9000:9000"  # API port
      - "9001:9001"  # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data

volumes:
  postgres_data:
  minio_data:
